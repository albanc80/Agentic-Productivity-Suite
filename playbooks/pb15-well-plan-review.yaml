id: well-plan-review
code: PB-15
name: Well Plan Review
area: Upstream operations
desk: upstream
status: mvp
safety_critical: true
summary: Deterministic casing, hydraulics and torque-and-drag checks, an engineering review with a risk register, NPT and field-operations challenge, an independent review, and sign-off by a qualified drilling engineer. Advisory only.
patterns: [P6, P2, P3, P4, P5]
triggers: [well plan, well design, casing design, hydraulics, ecd, torque and drag, drilling program, well review, afe, risk matrix]
inputs:
  - {id: well, label: "Well name and objective", type: text, required: true}
  - id: well_type
    label: Well type
    type: select
    options: [horizontal_shale, hpht, deepwater, multilateral, injector, exploration, appraisal]
    default: horizontal_shale
  - id: phase
    label: Lifecycle phase
    type: select
    options: [concept select, pre-FEED, FEED, detailed design, execution planning, post-well]
    default: detailed design
  - {id: basin, label: "Basin or field", type: text}
  - {id: plan_summary, label: "Plan summary: trajectory, casing program, mud program, BHA, key depths", type: longtext, required: true}
  - id: casing_json
    label: "Casing check input (JSON, optional)"
    type: longtext
    help: Runs the casing design checker exactly as entered. Leave empty to skip.
    example: '{"casing_size_in": <in>, "weight_ppf": <lb/ft>, "grade": "<e.g. P-110>", "setting_depth_ft": <ft TVD>, "pore_pressure_ppg": <ppg>, "fracture_gradient_ppg": <ppg>, "mud_weight_ppg": <ppg>, "well_type": "<well type>"}'  # format hint only, not values
  - id: hydraulics_json
    label: "Hydraulics input (JSON, optional)"
    type: longtext
    help: Runs the Bingham-plastic hydraulics solver. Bit nozzles in 32nds of an inch.
    example: '{"flow_rate_gpm": <gpm>, "mud_weight_ppg": <ppg>, "plastic_viscosity_cp": <cP>, "yield_point_lbf100sqft": <lbf/100 ft²>, "hole_size_in": <in>, "drillpipe_od_in": <in>, "tvd_ft": <ft>, "md_ft": <ft>, "bit_nozzles": [<32nds>, ...], "formation_angle_deg": <deg>}'  # format hint only, not values
  - id: td_json
    label: "Torque and drag input (JSON, optional)"
    type: longtext
    help: Survey stations from surface to TD plus drillstring. operation is one of tripping_in, tripping_out, rotating, sliding (anything else is treated as sliding).
    example: '{"well_profile": [{"md_ft": <ft>, "inclination_deg": <deg>, "azimuth_deg": <deg>}, ...], "drillstring": {"pipe_od_in": <in>, "steel_weight_ppf": <lb/ft>}, "mud_weight_ppg": <ppg>, "wob_klbf": <klbf>, "operation": "<tripping_in | tripping_out | rotating | sliding>", "casing_depth_ft": <ft>}'  # format hint only, not values
  - {id: hazards, label: "Known hazards and offset-well events", type: longtext}
  - {id: documents, label: "Offset data, prognosis, programs", type: documents}
steps:
  - id: casing_check
    kind: tool
    title: Casing design check
    when: {input: casing_json}
    tool: casing_design_checker
    args_from_input: casing_json
  - id: hydraulics_check
    kind: tool
    title: Hydraulics and ECD
    when: {input: hydraulics_json}
    tool: hydraulics_solver
    args_from_input: hydraulics_json
  - id: td_check
    kind: tool
    title: Torque and drag
    when: {input: td_json}
    tool: torque_drag_simulator
    args_from_input: td_json
  - id: engineering_review
    kind: agent
    title: Engineering review and risk register
    agent: well-planner
    task: |
      Review the plan for {{inputs.well}} ({{inputs.well_type}}, {{inputs.phase}}, {{inputs.basin}}).
      1. Use the calculator results above as the source for every design factor, ECD and load figure. Do not
         restate a number the calculators did not produce; label anything else ASSUMPTION.
      2. If you have tool access and the plan gives enough data for another casing string or load case, call
         the calculators rather than estimating by hand.
      3. Build the risk register with the risk_matrix_generator tool when available (hazards from the plan,
         offsets and the inputs), then add mitigations, contingencies and barrier verification checkpoints.
      4. State what must be validated in certified software and by whom before AFE or execution.
  - id: challenge
    kind: parallel
    title: NPT and field operations challenge
    steps:
      - id: npt_view
        kind: agent
        agent: npt-advisor
        title: NPT precursors
        task: |
          For this plan, list the drilling-mechanics NPT precursors most likely by section (vibration, MSE,
          ECD window, swab/surge, hole cleaning, stuck pipe), the parameters to monitor, alert thresholds to
          agree with the rig team, and what happens if nothing is done. Advisory only.
      - id: field_view
        kind: agent
        agent: domain-sme
        title: Field operations and HSE
        task: |
          Assess field practicality, HSE and well-control readiness, crew and equipment constraints, and
          what the rig team will push back on.
  - id: review
    kind: review
    title: Independent review
    agent: critical-mentor
    target: engineering_review
    on_fail: revise
    task: |
      Check the engineering review against the calculator outputs and the NPT and field findings. Flag any
      number without a calculator, input or standard behind it, any missing barrier or contingency, and any
      recommendation that would need certified-software validation before use.
  - id: approve
    kind: gate
    title: Qualified drilling engineer sign-off
    required_role: Qualified drilling engineer
    instructions: |
      Planning-grade review only. Approval records that a qualified engineer checked it; it does not replace
      certified engineering software, the operator's management-of-change process or well-control authority.
    payload_from: engineering_review
deliverable: engineering_review
