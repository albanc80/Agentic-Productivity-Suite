# Builds and verifies the desktop installers.
#
#   Linux:   productivity-suite_<version>_amd64.deb   (built on Ubuntu 22.04 for glibc 2.35+)
#   Windows: ProductivitySuite-<version>-x64.msi      (WiX v5)
#
# Every job smoke-tests the packaged app (headless, offline, real calculation)
# and then installs the package and smoke-tests the installed copy.
# Pull requests and manual runs publish the installers as workflow artifacts.
# A release is published automatically when a merge to main carries an app version
# that has no tag yet (bump backend/app/__init__.py and merge). It can also be
# published by pushing a tag like v0.1.0, or by running the workflow manually on
# main with release_tag set. The tag is created on the commit that was built.
name: Desktop installers

on:
  # Every pull request runs the full checks, so they can be required on main
  # (a path filter would leave docs-only PRs waiting forever for a required check).
  pull_request:
  push:
    # A merge to main publishes a release when the app version has no tag yet (see the version job).
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v0.1.0); it must match the app version. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  # Only superseded pull request runs are cancelled; a release in progress on main is never cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.11.32"
  WIX_VERSION: "5.0.2"

jobs:
  # Decides whether this run publishes a release, and which tag:
  #   manual run   -> the release_tag input (empty: build only)
  #   tag push     -> that tag
  #   push to main -> v<app version> if that tag does not exist yet; otherwise nothing runs
  version:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          version=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('backend/app/__init__.py').read()).group(1))")
          tag=""; build=true
          case "${{ github.event_name }}" in
            workflow_dispatch) tag="$INPUT_TAG" ;;
            pull_request) ;;
            push)
              if [ "${{ github.ref_type }}" = "tag" ]; then
                tag="${{ github.ref_name }}"
              elif git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
                echo "v$version is already released; nothing to do."; build=false
              else
                tag="v$version"; echo "New version $version on main: releasing $tag."
              fi ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  # Every pull request raises the app version (patch for fixes, minor for features), so its merge releases it.
  # Separate from the build: a missing bump shows as its own red check while tests and installers still run.
  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: The version files agree and are higher than the base branch
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          base=$(git show FETCH_HEAD:backend/app/__init__.py | python3 -c "import re,sys;print(re.search(r'__version__ = \"(.+?)\"', sys.stdin.read()).group(1))")
          python3 scripts/version.py check --newer-than "$base"

  test:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "20" }
      - run: pip install "uv==${UV_VERSION}"
      - name: Backend tests and lint
        working-directory: backend
        run: |
          uv sync --frozen --python 3.12
          SUITE_NO_AUTOAPP=1 uv run pytest -q
          uv run ruff check app tests ../scripts ../desktop/launcher.py ../desktop/smoke_test.py ../desktop/make_icons.py
      - name: Frontend typecheck and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  linux-deb:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "20" }
      - run: pip install "uv==${UV_VERSION}"
      - name: Version
        id: v
        run: echo "version=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('backend/app/__init__.py').read()).group(1))")" >> "$GITHUB_OUTPUT"
      - name: Build UI
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Built-in Google OAuth client (from the GOOGLE_OAUTH_CLIENT_JSON secret, if set)
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
        run: python desktop/bundle_oauth_client.py
      - name: Build app (PyInstaller)
        working-directory: backend
        run: |
          uv sync --frozen --python 3.12 --group desktop
          uv run pyinstaller ../desktop/productivity-suite.spec --noconfirm
      - name: Smoke-test the bundle
        run: python desktop/smoke_test.py backend/dist/ProductivitySuite/ProductivitySuite
      - name: Package .deb
        run: desktop/linux/build_deb.sh backend/dist/ProductivitySuite "${{ steps.v.outputs.version }}" installers
      - name: Upgrade over the last release and a same-version install, then smoke-test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.v.outputs.version }}"
          deb=$(ls installers/*.deb)
          # 1. The last published release, when there is one and it is not newer than this build.
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern "*.deb" --dir previous 2>/dev/null; then
            prev=$(ls previous/*.deb | head -1)
            prev_v=$(dpkg-deb -f "$prev" Version)
            if dpkg --compare-versions "$prev_v" le "$version"; then
              echo "Installing the last release first: $prev_v"; sudo apt-get install -y "./$prev"
            fi
          fi
          # 2. This build over it (a newer version upgrades in place), 3. again (same version: reinstall).
          sudo apt-get install -y "./$deb"
          sudo apt-get install -y --reinstall "./$deb"
          test "$(dpkg-query -W -f='${Version}' productivity-suite)" = "$version"
          cmp /opt/productivity-suite/ProductivitySuite backend/dist/ProductivitySuite/ProductivitySuite
          # The install step checked for uv and Node.js (and downloaded what the runner lacked).
          tools=/opt/productivity-suite/_internal/tools
          test -f "$tools/install.log" || { echo "the install step for uv and Node.js did not run"; exit 1; }
          cat "$tools/install.log"
          python desktop/smoke_test.py productivity-suite
          sudo apt-get remove -y productivity-suite
          if [ -e "$tools" ]; then echo "removing the package left $tools behind"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: productivity-suite-linux-deb
          path: installers/*.deb
          if-no-files-found: error

  windows-msi:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "20" }
      - run: pip install "uv==$env:UV_VERSION"
      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = (Select-String -Path backend/app/__init__.py -Pattern '__version__ = "(.+?)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build UI
        working-directory: frontend
        run: npm ci --no-audit --no-fund; npm run build
      - name: Built-in Google OAuth client (from the GOOGLE_OAUTH_CLIENT_JSON secret, if set)
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
        run: python desktop/bundle_oauth_client.py
      - name: Build app (PyInstaller)
        working-directory: backend
        run: |
          uv sync --frozen --python 3.12 --group desktop
          uv run pyinstaller ../desktop/productivity-suite.spec --noconfirm
      - name: Smoke-test the bundle
        run: python desktop/smoke_test.py backend\dist\ProductivitySuite\ProductivitySuite.exe
      - name: Build MSI (WiX)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          wix extension add -g "WixToolset.Util.wixext/$env:WIX_VERSION"
          $src = Resolve-Path backend\dist\ProductivitySuite
          $icon = Resolve-Path desktop\assets\icon.ico
          New-Item -ItemType Directory -Force installers, rebuild | Out-Null
          foreach ($out in "installers", "rebuild") {
            # Built twice: the second copy has the same version and a new product code, like a rebuild.
            wix build desktop\windows\productivity-suite.wxs -arch x64 -ext WixToolset.Util.wixext `
              -d "Version=${{ steps.v.outputs.version }}" -d "SourceDir=$src" -d "IconFile=$icon" `
              -o "$out\ProductivitySuite-${{ steps.v.outputs.version }}-x64.msi"
            if ($LASTEXITCODE -ne 0) { throw "wix build failed" }
          }
      - name: Upgrade over the last release and a same-version build, then smoke-test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.v.outputs.version }}"
          function Install($file, $log) {
            $p = Start-Process msiexec.exe -ArgumentList "/i `"$file`" /qn /l*v $log" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 60; throw "msiexec /i $file failed: $($p.ExitCode)" }
          }
          function Entries {
            @(Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -eq "Agentic Productivity Suite" })
          }
          # 1. The last published release, when there is one and it is not newer than this build.
          gh release download --repo $env:GITHUB_REPOSITORY --pattern "*.msi" --dir previous 2>$null
          $prev = Get-ChildItem previous\*.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($prev -and $prev.Name -match '-(\d+\.\d+\.\d+)-' -and [version]$Matches[1] -le [version]$version) {
            Write-Host "Installing the last release first: $($prev.Name)"
            Install $prev.FullName previous.log
          } else { Write-Host "No earlier release to upgrade from." }
          # 2. This build over it, then 3. a same-version rebuild over this build: each must replace, not add.
          $msi = (Resolve-Path installers\*.msi).Path
          Install $msi install.log
          Install (Resolve-Path rebuild\*.msi).Path reinstall.log
          $e = Entries
          if ($e.Count -ne 1) { $e | Format-List DisplayName, DisplayVersion, PSChildName; throw "expected 1 installed copy, found $($e.Count)" }
          if (-not $e[0].DisplayVersion.StartsWith($version)) { throw "installed version $($e[0].DisplayVersion), expected $version" }
          Write-Host "One installed copy, version $($e[0].DisplayVersion)"
          $exe = Join-Path $env:ProgramFiles "Agentic Productivity Suite\ProductivitySuite.exe"
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          $lnk = Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs\Agentic Productivity Suite.lnk"
          if (-not (Test-Path $lnk)) { throw "Start menu shortcut missing at $lnk" }
          # Icons: the exe must embed one, and the shortcut must point at an icon file that exists.
          Add-Type -Namespace Win32 -Name Shell -MemberDefinition '[DllImport("shell32.dll", CharSet=CharSet.Unicode)] public static extern uint ExtractIconEx(string f, int i, IntPtr[] l, IntPtr[] s, uint n);'
          $n = [Win32.Shell]::ExtractIconEx($exe, -1, $null, $null, 0)
          if ($n -lt 1) { throw "ProductivitySuite.exe has no embedded icon" }
          $sc = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          $iconFile = ($sc.IconLocation -split ',')[0]
          Write-Host "exe icons: $n; shortcut target: $($sc.TargetPath); icon: $($sc.IconLocation)"
          if (-not $iconFile -or -not (Test-Path $iconFile)) { throw "shortcut icon missing: '$($sc.IconLocation)'" }
          # The install step checked for uv and Node.js (and downloaded what the runner lacked).
          $tools = Join-Path $env:ProgramFiles "Agentic Productivity Suite\_internal\tools"
          if (-not (Test-Path (Join-Path $tools "install.log"))) { throw "the install step for uv and Node.js did not run" }
          Get-Content (Join-Path $tools "install.log")
          python desktop/smoke_test.py $exe
          if ($LASTEXITCODE -ne 0) { throw "smoke test of installed app failed" }
          $u = Start-Process msiexec.exe -ArgumentList "/x $($e[0].PSChildName) /qn" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstall failed: $($u.ExitCode)" }
          if (Test-Path $exe) { throw "uninstall left files behind" }
          if (Test-Path $tools) { throw "uninstall left the downloaded tools behind in $tools" }
          if ((Entries).Count -ne 0) { throw "uninstall left an entry in Apps" }
      - uses: actions/upload-artifact@v7
        with:
          name: productivity-suite-windows-msi
          path: installers/*.msi
          if-no-files-found: error

  release:
    if: needs.version.outputs.tag != ''
    needs: [version, linux-deb, windows-msi]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the app version and the branch
        run: |
          version=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('backend/app/__init__.py').read()).group(1))")
          if [ "$TAG" != "v$version" ]; then echo "Tag $TAG does not match app version $version"; exit 1; fi
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_type }}" != "tag" ]; then
            if [ "${{ github.ref }}" != "refs/heads/main" ]; then echo "Releases must be built from main"; exit 1; fi
          fi
      - uses: actions/download-artifact@v8
        with: { path: installers, merge-multiple: true }
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Agentic Productivity Suite ${{ env.TAG }}
          files: installers/*
          generate_release_notes: true
