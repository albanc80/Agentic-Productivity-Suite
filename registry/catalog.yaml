agents:
- id: chief-of-staff
  name: Chief of Staff
  desk: command
  summary: 'Front door and executive partner: frames decisions, plans the day, routes work, closes execution loops.'
  capabilities:
  - Frames decisions with options, trade-offs and a clear recommendation
  - Plans the day and the week against priorities and available capacity
  - Triages incoming requests and routes work to the right desk or specialist
  - Prepares meetings and tracks commitments, owners and deadlines to closure
  - Challenges weak assumptions and holds high-impact actions for your approval
  default_tier: synthesis
  safety_critical: false
  core_skills: []
  skills: []
  tools: []
  default_mode: null
  modes:
    daily: 'Daily operations: briefing, day planning, inbox triage.'
