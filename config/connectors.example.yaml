# MCP connectors. Copy to config/connectors.yaml (git-ignored) to customise.
#
# A connector becomes available when it is enabled and every ${VAR} it references
# (without a default) is set in the environment. Credentials stay in environment
# variables and are passed only to the connector process or request headers.
#
# READ-ONLY IS ENFORCED BY THE SUITE: tools are exposed only if they are
# allow-listed, declare read_only_hint, or (infer_read_only) are named like
# queries. Write tools are never offered to agents. Server-side read-only flags
# below are an extra layer.
#
# Launch details come from each project's README and change between releases.
# The `verify` field says what to confirm before relying on a preset.

connectors:
  - id: github
    name: GitHub
    description: Repositories, issues, pull requests and code search.
    transport: stdio
    command: docker
    args: [run, -i, --rm, -e, GITHUB_PERSONAL_ACCESS_TOKEN, -e, GITHUB_READ_ONLY, -e, GITHUB_TOOLSETS, ghcr.io/github/github-mcp-server]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN}
      GITHUB_READ_ONLY: "1"
      GITHUB_TOOLSETS: ${GITHUB_TOOLSETS:-repos,issues,pull_requests}
    setup: Create a fine-grained personal access token with read-only repository permissions and export GITHUB_PERSONAL_ACCESS_TOKEN. Requires Docker.
    verify: Image name, GITHUB_READ_ONLY and GITHUB_TOOLSETS variables in github/github-mcp-server README.

  - id: microsoft365
    name: Microsoft 365 (Graph)
    description: Mail, calendar, OneDrive files and Teams messages through Microsoft Graph.
    transport: stdio
    command: npx
    args: [-y, "@softeria/ms-365-mcp-server", --read-only, --org-mode]
    env:
      MS365_MCP_CLIENT_ID: ${MS365_MCP_CLIENT_ID:-}
      MS365_MCP_TENANT_ID: ${MS365_MCP_TENANT_ID:-}
    requires: [MS365_MCP_ENABLED]
    timeout_s: 90
    setup: Community server (Softeria). Sign in once with the device-code flow described in its README, then set MS365_MCP_ENABLED=1. Work accounts may need admin consent for Mail.Read and Calendars.Read. Remove --org-mode for personal accounts.
    verify: Package name and the --read-only / --org-mode flags in the softeria/ms-365-mcp-server README.

  - id: databricks-genie
    name: Databricks Genie
    description: Natural-language questions over a curated Genie space (read-only).
    transport: http
    url: ${DATABRICKS_HOST}/api/2.0/mcp/genie/${DATABRICKS_GENIE_SPACE_ID}
    headers:
      Authorization: Bearer ${DATABRICKS_TOKEN}
    timeout_s: 180
    setup: Set DATABRICKS_HOST (https://<workspace-host>), DATABRICKS_TOKEN (personal access token or OAuth token) and DATABRICKS_GENIE_SPACE_ID. Managed MCP servers must be enabled in the workspace.
    verify: URL pattern in the Databricks "managed MCP servers" docs; the feature is in preview and paths have been renamed before.

  - id: databricks-uc-functions
    name: Databricks Unity Catalog functions
    description: Predefined SQL functions in one catalog schema, exposed as tools.
    transport: http
    url: ${DATABRICKS_HOST}/api/2.0/mcp/functions/${DATABRICKS_UC_CATALOG}/${DATABRICKS_UC_SCHEMA}
    headers:
      Authorization: Bearer ${DATABRICKS_TOKEN}
    allow_tools: ["*"]   # UC functions are read queries you defined; narrow this list if any write
    setup: Set DATABRICKS_UC_CATALOG and DATABRICKS_UC_SCHEMA in addition to the Genie variables.
    verify: Whether your workspace uses the schema-level or function-level URL form.

  - id: databricks-search
    name: Databricks AI / Vector Search
    description: Retrieval over vector search indexes in one catalog schema.
    transport: http
    url: ${DATABRICKS_HOST}/api/2.0/mcp/vector-search/${DATABRICKS_VS_CATALOG}/${DATABRICKS_VS_SCHEMA}
    headers:
      Authorization: Bearer ${DATABRICKS_TOKEN}
    setup: Set DATABRICKS_VS_CATALOG and DATABRICKS_VS_SCHEMA.
    verify: Databricks renamed Vector Search to AI Search (/api/2.0/mcp/ai-search/...); the older prefix is documented as still working.

  - id: azure-devops
    name: Azure DevOps
    description: Projects, work items, repositories, pipelines and wiki.
    transport: stdio
    command: npx
    args: [-y, "@azure-devops/mcp", "${AZURE_DEVOPS_ORG}", -d, core, work, work-items, repositories, wiki]
    setup: Set AZURE_DEVOPS_ORG (organisation name only). Sign in when the server opens the browser. The suite blocks write tools; this server has no read-only flag.
    verify: Package name and the -d domain flag in microsoft/azure-devops-mcp. Maintainers recommend their remote server going forward.

  - id: atlassian
    name: Jira and Confluence
    description: Issues, projects and Confluence pages.
    transport: stdio
    command: docker
    args: [run, -i, --rm, -e, JIRA_URL, -e, JIRA_USERNAME, -e, JIRA_API_TOKEN, -e, CONFLUENCE_URL, -e, CONFLUENCE_USERNAME, -e, CONFLUENCE_API_TOKEN, -e, READ_ONLY_MODE, "ghcr.io/sooperset/mcp-atlassian:latest"]
    env:
      JIRA_URL: ${JIRA_URL}
      JIRA_USERNAME: ${JIRA_USERNAME}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN}
      CONFLUENCE_URL: ${CONFLUENCE_URL:-}
      CONFLUENCE_USERNAME: ${CONFLUENCE_USERNAME:-}
      CONFLUENCE_API_TOKEN: ${CONFLUENCE_API_TOKEN:-}
      READ_ONLY_MODE: "true"
    setup: Community server (sooperset/mcp-atlassian). Create an Atlassian API token. Confluence variables are optional.
    verify: Image tag and variable names in the sooperset/mcp-atlassian README; whether CONFLUENCE_URL needs the /wiki suffix.

  - id: local-files
    name: Local files
    network: false   # works in offline mode
    description: Read files in one folder you choose (reports, exports, notes).
    transport: stdio
    command: npx
    args: [-y, "@modelcontextprotocol/server-filesystem", "${SUITE_FILES_DIR}"]
    allow_tools: [read_file, read_text_file, read_multiple_files, list_directory, list_directory_with_sizes, directory_tree, search_files, get_file_info, list_allowed_directories]
    setup: Set SUITE_FILES_DIR to the folder agents may read. Nothing outside it is reachable.
    verify: Tool names in the @modelcontextprotocol/server-filesystem README.
