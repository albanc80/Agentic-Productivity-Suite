# MCP connectors. Copy to config/connectors.yaml (git-ignored) to customise.
#
# Set connectors up in the app: Settings > Connectors (switch, values, folders).
# A connector becomes available when it is switched on and every ${VAR} it
# references (without a default) has a value, typed in the app or set as an
# environment variable (the environment wins). Values are passed only to the
# connector process or request headers.
#
# READ-ONLY IS ENFORCED BY THE SUITE: tools are exposed only if they are
# allow-listed, declare read_only_hint, or (infer_read_only) are named like
# queries. Write tools are never offered to agents. Server-side read-only flags
# below are an extra layer.
#
# Launch details come from each project's README and change between releases.
# The `verify` field says what to confirm before relying on a preset.

connectors:
  - id: github
    name: GitHub
    description: Repositories, issues, pull requests and code search.
    transport: stdio
    command: docker
    args: [run, -i, --rm, -e, GITHUB_PERSONAL_ACCESS_TOKEN, -e, GITHUB_READ_ONLY, -e, GITHUB_TOOLSETS, ghcr.io/github/github-mcp-server]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN}
      GITHUB_READ_ONLY: "1"
      GITHUB_TOOLSETS: ${GITHUB_TOOLSETS:-repos,issues,pull_requests}
    setup: Create a fine-grained personal access token with read-only repository permissions and export GITHUB_PERSONAL_ACCESS_TOKEN. Requires Docker.
    verify: Image name, GITHUB_READ_ONLY and GITHUB_TOOLSETS variables in github/github-mcp-server README.

  - id: microsoft365
    name: Microsoft 365 (Outlook, OneDrive, Teams)
    description: Outlook mail and calendar, OneDrive files, contacts, To Do tasks and OneNote through Microsoft Graph (read-only). Teams and SharePoint with the work preset.
    transport: stdio
    command: npx
    args: [-y, "@softeria/ms-365-mcp-server", --read-only, --preset, "${MS365_MCP_PRESET:-personal}"]
    env:
      MS365_MCP_CLIENT_ID: ${MS365_MCP_CLIENT_ID:-}
      MS365_MCP_TENANT_ID: ${MS365_MCP_TENANT_ID:-}
      MS365_MCP_ORG_MODE: ${MS365_MCP_ORG_MODE:-}
    requires: [MS365_MCP_ENABLED]
    accounts: {param: account, vars: [MS365_ACCOUNTS]}
    timeout_s: 90
    setup: >-
      Community server (Softeria). Sign in once by running `npx -y @softeria/ms-365-mcp-server --login`
      and following the code shown, then set MS365_MCP_ENABLED=1. The default preset `personal` covers
      mail, calendar, OneDrive files, contacts, tasks, OneNote and search. Work or school account: set
      MS365_MCP_ORG_MODE=1; for Teams, SharePoint and shared mailboxes also set MS365_MCP_PRESET=work
      (or `all`). Work tenants may need admin consent for the requested Graph permissions. Requires Node.js.
      Several accounts: run --login once per account, then list them in MS365_ACCOUNTS (comma-separated,
      default first). Agents may then use only those accounts.
    verify: Package name, the --read-only and --preset flags, the preset names, MS365_MCP_ORG_MODE and the multi-account `account` argument in the softeria/ms-365-mcp-server README and PRESETS.md.

  - id: google-workspace
    name: Google Workspace (Gmail, Calendar, Drive)
    description: Gmail, Google Calendar and Google Drive, plus Docs, Sheets, Slides, Tasks and Contacts (read-only).
    transport: stdio
    command: uvx
    args: [workspace-mcp, --read-only, --tool-tier, "${GOOGLE_WORKSPACE_TOOL_TIER:-core}",
           --tools, gmail, calendar, drive, docs, sheets, slides, tasks, contacts]
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      USER_GOOGLE_EMAIL: ${USER_GOOGLE_EMAIL}
      WORKSPACE_MCP_PORT: ${WORKSPACE_MCP_PORT:-8000}
    accounts: {param: user_google_email, vars: [USER_GOOGLE_EMAIL, GOOGLE_OTHER_ACCOUNTS]}
    timeout_s: 120
    setup: >-
      Community server (taylorwilsdon/google_workspace_mcp, MIT). In Google Cloud Console create a project,
      enable the Gmail, Google Calendar, Google Drive, Google Docs, Google Sheets, Google Slides, Google Tasks
      and People APIs, and create an OAuth client. If you choose the Web application type, add
      http://localhost:8000/oauth2callback as an authorised redirect URI (change the port with
      WORKSPACE_MCP_PORT). Enter the client ID, the client secret and your Google address (USER_GOOGLE_EMAIL).
      The first time an agent reads your data the server opens your browser for Google sign-in; approve it
      and run the step again. Tokens are kept in ~/.google_workspace_mcp/credentials. Requires uv (uvx).
      GOOGLE_WORKSPACE_TOOL_TIER=extended adds more read tools (for example labels and threads).
      Several accounts: put the extra addresses in GOOGLE_OTHER_ACCOUNTS (comma-separated); each one
      signs in through the browser the first time it is used. USER_GOOGLE_EMAIL stays the default.
    verify: Package name (workspace-mcp on PyPI), the --read-only, --tool-tier and --tools flags, the variable names, the per-call user_google_email argument and the OAuth redirect in the google_workspace_mcp README and docs.

  - id: databricks-genie
    name: Databricks Genie
    description: Natural-language questions over a curated Genie space (read-only).
    transport: http
    url: ${DATABRICKS_HOST}/api/2.0/mcp/genie/${DATABRICKS_GENIE_SPACE_ID}
    headers:
      Authorization: Bearer ${DATABRICKS_TOKEN}
    timeout_s: 180
    setup: Set DATABRICKS_HOST (https://<workspace-host>), DATABRICKS_TOKEN (personal access token or OAuth token) and DATABRICKS_GENIE_SPACE_ID. Managed MCP servers must be enabled in the workspace.
    verify: URL pattern in the Databricks "managed MCP servers" docs; the feature is in preview and paths have been renamed before.

  - id: databricks-uc-functions
    name: Databricks Unity Catalog functions
    description: Predefined SQL functions in one catalog schema, exposed as tools.
    transport: http
    url: ${DATABRICKS_HOST}/api/2.0/mcp/functions/${DATABRICKS_UC_CATALOG}/${DATABRICKS_UC_SCHEMA}
    headers:
      Authorization: Bearer ${DATABRICKS_TOKEN}
    allow_tools: ["*"]   # UC functions are read queries you defined; narrow this list if any write
    setup: Set DATABRICKS_UC_CATALOG and DATABRICKS_UC_SCHEMA in addition to the Genie variables.
    verify: Whether your workspace uses the schema-level or function-level URL form.

  - id: databricks-search
    name: Databricks AI / Vector Search
    description: Retrieval over vector search indexes in one catalog schema.
    transport: http
    url: ${DATABRICKS_HOST}/api/2.0/mcp/vector-search/${DATABRICKS_VS_CATALOG}/${DATABRICKS_VS_SCHEMA}
    headers:
      Authorization: Bearer ${DATABRICKS_TOKEN}
    setup: Set DATABRICKS_VS_CATALOG and DATABRICKS_VS_SCHEMA.
    verify: Databricks renamed Vector Search to AI Search (/api/2.0/mcp/ai-search/...); the older prefix is documented as still working.

  - id: azure-devops
    name: Azure DevOps
    description: Projects, work items, repositories, pipelines and wiki.
    transport: stdio
    command: npx
    args: [-y, "@azure-devops/mcp", "${AZURE_DEVOPS_ORG}", -d, core, work, work-items, repositories, wiki]
    setup: Set AZURE_DEVOPS_ORG (organisation name only). Sign in when the server opens the browser. The suite blocks write tools; this server has no read-only flag.
    verify: Package name and the -d domain flag in microsoft/azure-devops-mcp. Maintainers recommend their remote server going forward.

  - id: atlassian
    name: Jira and Confluence
    description: Issues, projects and Confluence pages.
    transport: stdio
    command: docker
    args: [run, -i, --rm, -e, JIRA_URL, -e, JIRA_USERNAME, -e, JIRA_API_TOKEN, -e, CONFLUENCE_URL, -e, CONFLUENCE_USERNAME, -e, CONFLUENCE_API_TOKEN, -e, READ_ONLY_MODE, "ghcr.io/sooperset/mcp-atlassian:latest"]
    env:
      JIRA_URL: ${JIRA_URL}
      JIRA_USERNAME: ${JIRA_USERNAME}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN}
      CONFLUENCE_URL: ${CONFLUENCE_URL:-}
      CONFLUENCE_USERNAME: ${CONFLUENCE_USERNAME:-}
      CONFLUENCE_API_TOKEN: ${CONFLUENCE_API_TOKEN:-}
      READ_ONLY_MODE: "true"
    setup: Community server (sooperset/mcp-atlassian). Create an Atlassian API token. Confluence variables are optional.
    verify: Image tag and variable names in the sooperset/mcp-atlassian README; whether CONFLUENCE_URL needs the /wiki suffix.

  - id: local-files
    name: Local files
    transport: builtin   # runs inside the suite: no Node.js needed, works offline
    network: false
    description: Read files in folders you choose (reports, exports, notes, PDFs, Word and Excel files).
    setup: Choose the folders in Settings > Connectors > Local files. Agents can list, search and read files inside them, and nothing else.
