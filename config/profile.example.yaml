# User profile injected into every agent prompt.
# Fill it in (the desktop app keeps its copy in ~/.productivity-suite/profile.yaml).
# Empty fields are left out of prompts. Keep it short: it is sent with every model call.

name: ""                     # optional; agents address you as "the user" when empty
role: ""                     # e.g. your job title
organization_context: ""     # industry, team, what your organisation does
goals: []                    # what you want the suite to help you achieve
working_preferences: []      # how you like answers, e.g. "Lead with the answer, then the reasoning"
domain_notes: ""             # standards, systems or vocabulary agents should know
