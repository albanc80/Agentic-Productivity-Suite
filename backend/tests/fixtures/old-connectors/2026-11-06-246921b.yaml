# MCP connectors. Copy to config/connectors.yaml (git-ignored) to customise.
#
# Set connectors up in the app: Settings > Connectors (switch, values, folders).
# A connector becomes available when it is switched on and every ${VAR} it
# references (without a default) has a value, typed in the app or set as an
# environment variable (the environment wins). Values are passed only to the
# connector process or request headers.
#
# READ-ONLY IS ENFORCED BY THE SUITE: tools are exposed only if they are
# allow-listed, declare read_only_hint, or (infer_read_only) are named like
# queries. Write tools are never offered to agents. Server-side read-only flags
# below are an extra layer.
#
# Launch details come from each project's README and change between releases.
# The `verify` field says what to confirm before relying on a preset.

connectors:
  - id: github
    name: GitHub
    description: Repositories, issues, pull requests and code search.
    transport: stdio
    command: docker
    args: [run, -i, --rm, -e, GITHUB_PERSONAL_ACCESS_TOKEN, -e, GITHUB_HOST, -e, GITHUB_READ_ONLY, -e, GITHUB_TOOLSETS, ghcr.io/github/github-mcp-server]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN}
      GITHUB_HOST: ${GITHUB_HOST:-}
      GITHUB_READ_ONLY: "1"
      GITHUB_TOOLSETS: ${GITHUB_TOOLSETS:-repos,issues,pull_requests}
    context:
      GITHUB_REPOS: "Repositories the person works in: {value}. Use these unless asked about others."
    labels:
      GITHUB_PERSONAL_ACCESS_TOKEN: Personal access token
      GITHUB_HOST: GitHub Enterprise address
      GITHUB_REPOS: Repositories you work in
      GITHUB_TOOLSETS: Toolsets
    hints:
      GITHUB_HOST: Leave blank for github.com. Only for GitHub Enterprise Server (https://github.yourcompany.com) or https://yourname.ghe.com.
      GITHUB_REPOS: "Optional, comma-separated: owner/repo or the repository URL. Agents look here first; what they can reach is decided by the token."
      GITHUB_TOOLSETS: "Default: repos,issues,pull_requests. Add actions or code_security to read CI runs or security alerts."
    setup: >-
      Reads repositories, issues, pull requests and code through GitHub's official MCP server, in read-only mode.
      For github.com the token is all it needs; no site or repository URL is required.
    steps:
      - Install Docker Desktop (Windows, macOS) or Docker Engine (Linux) and start it. The connector runs GitHub's server in a container.
      - "On GitHub open Settings > Developer settings > Personal access tokens > Fine-grained tokens > Generate new token (https://github.com/settings/personal-access-tokens/new)."
      - "Under Repository access choose the repositories agents may read (or all). Under Permissions set Contents, Issues, Pull requests and Metadata to Read-only. Generate the token and copy it."
      - Paste the token below. Leave GitHub Enterprise address blank unless your company runs its own GitHub.
      - Optionally list the repositories you work in, save, switch the connector on and press Test.
    docs_url: https://github.com/github/github-mcp-server
    verify: Image name and the GITHUB_HOST, GITHUB_READ_ONLY and GITHUB_TOOLSETS variables in the github/github-mcp-server README.

  - id: microsoft365
    name: Microsoft 365 (Outlook, OneDrive, Teams)
    description: Outlook mail and calendar, OneDrive files, contacts, To Do tasks and OneNote through Microsoft Graph (read-only). Teams and SharePoint with the work preset.
    transport: stdio
    command: npx
    args: [-y, "@softeria/ms-365-mcp-server", --read-only, --preset, "${MS365_MCP_PRESET:-personal}"]
    env:
      MS365_MCP_CLIENT_ID: ${MS365_MCP_CLIENT_ID:-}
      MS365_MCP_TENANT_ID: ${MS365_MCP_TENANT_ID:-}
      MS365_MCP_ORG_MODE: ${MS365_MCP_ORG_MODE:-}
    requires: [MS365_MCP_ENABLED]
    accounts: {param: account, vars: [MS365_ACCOUNTS]}
    # Sign-in from Settings: the suite runs this server with these arguments added to the ones above, so the
    # sign-in asks for the same read-only permissions. The server keeps the tokens; the suite never sees them.
    signin:
      provider: Microsoft
      login: [--login]
      accounts: [--list-accounts]
      remove: [--remove-account]
      confirms: MS365_MCP_ENABLED
    timeout_s: 90
    labels:
      MS365_ACCOUNTS: Accounts agents may use
      MS365_MCP_ORG_MODE: Work or school account
      MS365_MCP_PRESET: Preset
      MS365_MCP_CLIENT_ID: Custom app (client) ID
      MS365_MCP_TENANT_ID: Tenant ID
    hints:
      MS365_ACCOUNTS: "Comma-separated email addresses, default first. Filled in for you when you sign in above; remove an address here to stop agents using it without signing it out."
      MS365_MCP_ORG_MODE: "Enter 1 for a work or school account (needed for Teams, SharePoint and shared mailboxes), save, then sign in. Leave blank for a personal account."
      MS365_MCP_PRESET: "personal (default): mail, calendar, OneDrive, contacts, To Do, OneNote. work: adds Teams and SharePoint (needs Work or school account = 1). all: everything read-only. Sign in again after changing it."
      MS365_MCP_CLIENT_ID: Leave blank unless your IT department gave you an app registration to use.
      MS365_MCP_TENANT_ID: "Leave blank unless your IT department told you to set it. Personal accounts only: if Microsoft stops accepting the sign-in after a while, enter consumers, save and sign in again."
    setup: >-
      Reads Outlook mail and calendar, OneDrive, contacts, To Do and OneNote through Microsoft Graph, using the
      community server by Softeria in read-only mode. Sign in from here: the app shows a code, you enter it on
      Microsoft's sign-in page, and the server keeps the sign-in on this computer.
    steps:
      - "Work or school account only: enter 1 in Work or school account below and press Save first."
      - "Press Sign in with Microsoft. Nothing to install: the app uses Node.js from this computer if it has a recent one, or its own copy. The first sign-in downloads the connector, which can take a minute."
      - "Copy the code the app shows, open Microsoft's sign-in page, paste the code, sign in with the account agents should read and accept the permissions (read-only). Work tenants may need an administrator to approve them."
      - "The app notices when you are done, adds the account and switches the connector on. Press Test to see the tools."
      - "Several accounts: press Add another account and sign in with the next one. The first account is the default."
    docs_url: https://github.com/Softeria/ms-365-mcp-server#readme
    verify: Package name, the --read-only, --preset, --login, --list-accounts and --remove-account flags, MS365_MCP_ORG_MODE and the multi-account `account` argument in the Softeria/ms-365-mcp-server README.

  - id: google-workspace
    name: Google Workspace (Gmail, Calendar, Drive)
    description: Gmail, Google Calendar and Google Drive, plus Docs, Sheets, Slides, Tasks and Contacts (read-only).
    transport: stdio
    command: uvx
    args: [workspace-mcp, --read-only, --tool-tier, "${GOOGLE_WORKSPACE_TOOL_TIER:-core}",
           --tools, gmail, calendar, drive, docs, sheets, slides, tasks, contacts]
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      USER_GOOGLE_EMAIL: ${USER_GOOGLE_EMAIL}
      WORKSPACE_MCP_PORT: ${WORKSPACE_MCP_PORT:-8000}
    accounts: {param: user_google_email, vars: [USER_GOOGLE_EMAIL, GOOGLE_OTHER_ACCOUNTS]}
    # An OAuth client built into the app: google-oauth-client.json (as Google Cloud downloads it) in the config
    # folder or next to connectors.yaml. Installers get it from the GOOGLE_OAUTH_CLIENT_JSON build secret.
    client_file:
      name: google-oauth-client.json
      vars: {client_id: GOOGLE_OAUTH_CLIENT_ID, client_secret: GOOGLE_OAUTH_CLIENT_SECRET}
    # Sign-in from Settings: the suite starts this server and calls its own sign-in tool; the server's local
    # callback saves the account's credentials (one file per address), which is how the suite sees it is done.
    signin:
      provider: Google
      kind: tool
      # Added to the arguments above while signing in: the server lists its sign-in tool only in the complete
      # tier. The permissions it asks for come from --tools and --read-only, so they do not change.
      login: [--tool-tier, complete]
      tool: start_google_auth
      tool_args: {service_name: Google Workspace}
      account_arg: user_google_email
      credentials_dir: ${WORKSPACE_MCP_CREDENTIALS_DIR:-~/.google_workspace_mcp/credentials}
      timeout_s: 600
    timeout_s: 120
    labels:
      GOOGLE_OAUTH_CLIENT_ID: OAuth client ID
      GOOGLE_OAUTH_CLIENT_SECRET: OAuth client secret
      USER_GOOGLE_EMAIL: Google email (default account)
      GOOGLE_OTHER_ACCOUNTS: Other Google accounts
      GOOGLE_WORKSPACE_TOOL_TIER: Tool tier
      WORKSPACE_MCP_PORT: Sign-in port
    hints:
      GOOGLE_OAUTH_CLIENT_ID: "Leave blank when it says Built into this app. Otherwise create a client as in the steps above."
      USER_GOOGLE_EMAIL: Filled in when you sign in above. Agents read this account unless asked about another.
      GOOGLE_OTHER_ACCOUNTS: "Filled in when you sign in with more accounts. Remove an address here to stop agents using it without signing it out."
      GOOGLE_WORKSPACE_TOOL_TIER: "core (default) or extended (more read tools, for example labels and threads)."
      WORKSPACE_MCP_PORT: "Default 8000. Change it only if another program uses that port."
    setup: >-
      Reads Gmail, Calendar, Drive, Docs, Sheets, Slides, Tasks and Contacts with the community server
      workspace-mcp (taylorwilsdon/google_workspace_mcp) in read-only mode. Sign in from here: a Google page
      opens in your browser, and the server keeps the sign-in on this computer.
    steps:
      - "OAuth client: nothing to do when it says Built into this app. Otherwise press Upload client file and choose the .json file you were given with the app (or your own: see the full setup guide)."
      - "Under Sign-in, enter your Google address and press Sign in with Google. Nothing to install: the app uses uv from this computer or its own copy. The first sign-in downloads the connector, which can take a minute."
      - "A Google page opens in your browser on this computer. Sign in and allow read-only access. If Google says it has not verified the app, choose Advanced, then continue: it is the app's own client. If Google says access is blocked, ask the person who shared the app to add your address as a test user."
      - "The app notices when you are done, adds the account and switches the connector on. Press Test to see the tools."
      - "Several accounts: press Add another account and sign in with the next one. The first account is the default."
    docs_url: https://github.com/taylorwilsdon/google_workspace_mcp#readme
    verify: Package name (workspace-mcp on PyPI), the --read-only, --tool-tier and --tools flags, the variable names, the per-call user_google_email argument, the start_google_auth tool and the credentials folder (WORKSPACE_MCP_CREDENTIALS_DIR, one file per address) in the google_workspace_mcp README and source.

  - id: databricks
    name: Databricks
    description: Genie spaces, Unity Catalog functions and Vector Search in one workspace (read-only). Fill in the services you use.
    transport: http
    headers:
      Authorization: Bearer ${DATABRICKS_TOKEN}
    timeout_s: 180
    replaces: [databricks-genie, databricks-uc-functions, databricks-search]
    parts:
      - id: genie
        name: Genie space
        description: Natural-language questions over a curated Genie space.
        url: ${DATABRICKS_HOST}/api/2.0/mcp/genie/${DATABRICKS_GENIE_SPACE_ID}
      - id: functions
        name: Unity Catalog functions
        description: The SQL functions in one catalog schema, as tools.
        url: ${DATABRICKS_HOST}/api/2.0/mcp/functions/${DATABRICKS_UC_CATALOG}/${DATABRICKS_UC_SCHEMA}
        allow_tools: ["*"]   # UC functions are read queries you defined; narrow this list if any write
      - id: search
        name: Vector Search
        description: Retrieval over the vector search indexes in one catalog schema.
        url: ${DATABRICKS_HOST}/api/2.0/mcp/vector-search/${DATABRICKS_VS_CATALOG}/${DATABRICKS_VS_SCHEMA}
    labels:
      DATABRICKS_HOST: Workspace URL
      DATABRICKS_TOKEN: Access token
      DATABRICKS_GENIE_SPACE_ID: Genie space ID
      DATABRICKS_UC_CATALOG: Catalog
      DATABRICKS_UC_SCHEMA: Schema
      DATABRICKS_VS_CATALOG: Catalog
      DATABRICKS_VS_SCHEMA: Schema
    hints:
      DATABRICKS_HOST: "https://<your-workspace>.cloud.databricks.com or https://adb-<id>.<n>.azuredatabricks.net, without a trailing slash."
      DATABRICKS_GENIE_SPACE_ID: "Open the Genie space; the ID is the part of the address after /genie/rooms/."
    setup: >-
      Connects to the managed MCP servers of one Databricks workspace. Enter the workspace and a token once, then
      fill in the services you use: each one turns on when its fields are filled in. Managed MCP servers must be
      enabled in the workspace.
    steps:
      - "Copy your workspace URL from the browser address bar (for example https://adb-1234567890123456.7.azuredatabricks.net)."
      - "Create a token: your user menu > Settings > Developer > Access tokens > Generate new token. Copy it."
      - "Fill in the services you use: a Genie space ID; the catalog and schema of your Unity Catalog functions; the catalog and schema of your vector search indexes."
      - Save, switch the connector on and press Test. Each service you filled in is listed with its read-only tools.
    docs_url: https://docs.databricks.com/aws/en/generative-ai/mcp/managed-mcp
    verify: URL patterns in the Databricks managed MCP servers docs (preview; paths have been renamed before, and Vector Search is now also called AI Search).

  - id: azure-devops
    name: Azure DevOps
    description: Projects, work items, repositories, pipelines and wiki.
    transport: stdio
    command: npx
    args: [-y, "@azure-devops/mcp", "${AZURE_DEVOPS_ORG}", -d, core, work, work-items, repositories, wiki]
    labels:
      AZURE_DEVOPS_ORG: Organisation
    hints:
      AZURE_DEVOPS_ORG: "The name only: for https://dev.azure.com/contoso enter contoso."
    setup: Reads projects, work items, repositories and wiki with Microsoft's Azure DevOps MCP server. The suite blocks write tools; this server has no read-only flag.
    steps:
      - "Enter your organisation name below, save, switch the connector on and press Test. Nothing to install: the app uses Node.js from this computer if it has a recent one, or its own copy."
      - Your browser opens for Microsoft sign-in the first time; sign in with the account that has access to the organisation.
    docs_url: https://github.com/microsoft/azure-devops-mcp#readme
    verify: Package name and the -d domain flag in microsoft/azure-devops-mcp. Maintainers recommend their remote server going forward.

  - id: atlassian
    name: Jira and Confluence
    description: Issues, projects and Confluence pages.
    transport: stdio
    command: docker
    args: [run, -i, --rm, -e, JIRA_URL, -e, JIRA_USERNAME, -e, JIRA_API_TOKEN, -e, CONFLUENCE_URL, -e, CONFLUENCE_USERNAME, -e, CONFLUENCE_API_TOKEN, -e, READ_ONLY_MODE, "ghcr.io/sooperset/mcp-atlassian:latest"]
    env:
      JIRA_URL: ${JIRA_URL}
      JIRA_USERNAME: ${JIRA_USERNAME}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN}
      CONFLUENCE_URL: ${CONFLUENCE_URL:-}
      CONFLUENCE_USERNAME: ${CONFLUENCE_USERNAME:-}
      CONFLUENCE_API_TOKEN: ${CONFLUENCE_API_TOKEN:-}
      READ_ONLY_MODE: "true"
    labels:
      JIRA_URL: Jira address
      JIRA_USERNAME: Jira email
      JIRA_API_TOKEN: Jira API token
      CONFLUENCE_URL: Confluence address
      CONFLUENCE_USERNAME: Confluence email
      CONFLUENCE_API_TOKEN: Confluence API token
    hints:
      JIRA_URL: "For example https://yourcompany.atlassian.net"
      CONFLUENCE_URL: "Optional. For example https://yourcompany.atlassian.net/wiki"
    setup: Reads Jira issues and projects, and optionally Confluence pages, with the community server sooperset/mcp-atlassian in read-only mode.
    steps:
      - Install Docker Desktop (Windows, macOS) or Docker Engine (Linux) and start it.
      - "Create an API token at https://id.atlassian.com/manage-profile/security/api-tokens and copy it."
      - Enter the Jira address, your Atlassian email and the token. For Confluence, fill in its fields too (the same token works on Atlassian Cloud).
      - Save, switch the connector on and press Test.
    docs_url: https://github.com/sooperset/mcp-atlassian#readme
    verify: Image tag and variable names in the sooperset/mcp-atlassian README; whether CONFLUENCE_URL needs the /wiki suffix.

  - id: local-files
    name: Local files
    transport: builtin   # runs inside the suite: no Node.js needed, works offline
    network: false
    description: Read files in folders you choose (reports, exports, notes, PDFs, Word and Excel files).
    setup: Choose the folders in Settings > Connectors > Local files. Agents can list, search and read files inside them, and nothing else.
