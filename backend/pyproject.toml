[project]
name = "productivity-suite"
version = "0.5.0"
license = "Apache-2.0"
description = "Platform-agnostic orchestration of specialist agents into governed productivity playbooks."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.38.0",
    "pydantic>=2.14,<3",
    "pyyaml>=6.0.2",
    "anthropic==2.4.0",
    "openai==3.42.1",
    "mcp==2.3.0",
    "markdown-it-py>=3.0",
    "python-multipart>=0.0.20",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[dependency-groups]
desktop = [
    "pywebview==6.2.1",
    "pyinstaller==6.22.3",
    "pillow==13.0.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]  # B008: FastAPI File()/Depends() defaults are idiomatic

[tool.ruff.lint.per-file-ignores]
"app/tools/calculators/*" = ["UP", "B", "E741", "F401", "I"]
"../desktop/*.spec" = ["F821"]
